\* TLC configuration for the HARQ TLA+ model.
\*
\* Bounds chosen to keep the state space small enough that the model
\* checker terminates on a standard CI runner in seconds:
\*   - RvIdxSequence: 4 attempts (the four standard redundancy versions).
\*   - InformationBlocks: a 2-element tag set.

SPECIFICATION Spec

CONSTANTS
    RvIdxSequence <- RvIdxSeqDefault
    InformationBlocks <- InformationBlocksDefault

INVARIANTS
    TypeOK
    CRCPassImpliesSyndromeZero
    DoneIsExplicit

PROPERTIES
    EventualTermination
