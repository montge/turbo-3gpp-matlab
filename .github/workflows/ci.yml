name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  octave:
    name: Octave smoke + multi-segment round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --fix-missing octave
          octave --version | head -1

      - name: Single-segment smoke test (A=16, G=132, C=1)
        run: octave --no-gui test_octave_smoke.m

      - name: Multi-segment round trip (A=8000, G=24000, C=2)
        run: |
          octave --no-gui --eval "
            warning('off', 'all');
            addpath(pwd);
            rand('state', 42);
            A = 8000; G = 24000;
            hEnc = turbo_encoding_chain('A', A, 'G', G, 'Q_m', 2);
            hDec = turbo_decoding_chain('A', A, 'G', G, 'Q_m', 2, 'iterations', 8);
            assert(hEnc.C == 2, sprintf('expected C=2, got %d', hEnc.C));
            assert(isequal(hEnc.E_r, hDec.E_r), 'encoder and decoder disagree on E_r');
            a = double(rand(1, A) > 0.5);
            f = step(hEnc, a);
            assert(length(f) == G, sprintf('encoded length %d != G=%d', length(f), G));
            f_llr = 1 - 2 * f;
            a_hat = step(hDec, f_llr);
            assert(~isempty(a_hat), 'decoder returned empty (CRC failed)');
            assert(isequal(a, a_hat), sprintf('round-trip mismatch: %d bit errors', sum(a ~= a_hat)));
            fprintf('MULTI-SEGMENT NOISE-FREE PASS\n');
          "

  openspec:
    name: Validate OpenSpec changes and specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Validate all OpenSpec items (strict)
        run: npx openspec validate --all --strict

  tests:
    name: MOxUnit suite, coverage gate, traceability, MISS_HIT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --fix-missing octave
          octave --version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MISS_HIT and defusedxml
        # defusedxml hardens scripts/coverage_gate.py's XML parsing against
        # billion-laughs / quadratic-blowup DoS. The script also falls back to
        # the stdlib parser when defusedxml is unavailable.
        run: pip install --quiet miss_hit==0.9.42 defusedxml==0.7.1

      - name: Run MOxUnit suite (unit + property tests)
        run: bash scripts/run_tests.sh

      - name: Spec-to-test traceability check
        run: python3 scripts/check_spec_traceability.py

      - name: MOcov line coverage with 90% gate
        run: bash scripts/run_coverage.sh

      - name: MISS_HIT static analysis (mh_style + mh_lint + mh_metric)
        run: bash scripts/run_miss_hit.sh

      - name: Upload coverage and metric artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            tests/coverage.txt
            tests/coverage.xml
            tests/metric.txt
          if-no-files-found: warn

  verify-lean:
    name: Lean 4 proofs (proofs/lean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lean toolchain
        id: cache-lean
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: lean-${{ hashFiles('proofs/lean/lean-toolchain') }}-v1

      - name: Install Lean (with fallback for restricted networks)
        if: steps.cache-lean.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Read the pinned toolchain. Format: leanprover/lean4:vX.Y.Z
          TOOLCHAIN="$(tr -d '[:space:]' < proofs/lean/lean-toolchain)"
          VERSION="${TOOLCHAIN##*:}"        # v4.14.0
          VERSION_NUM="${VERSION#v}"        # 4.14.0
          echo "Pinned toolchain: $TOOLCHAIN  (version $VERSION_NUM)"

          # 1) Install elan itself. The -y skips the interactive prompt and
          #    --default-toolchain none avoids elan immediately trying to
          #    fetch a default toolchain (we install the pinned one below).
          echo "::group::Install elan"
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          echo "::endgroup::"
          export PATH="$HOME/.elan/bin:$PATH"
          elan --version

          # 2) Try the standard elan flow first. Fall back to direct GitHub
          #    tarball install if release.lean-lang.org is unreachable
          #    (some corporate / sandbox networks block it).
          echo "::group::Install Lean toolchain $VERSION_NUM"
          if elan default "$TOOLCHAIN" 2>elan.err ; then
              echo "elan default succeeded."
          else
              echo "elan default failed; falling back to direct GitHub install:"
              cat elan.err || true
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends zstd
              mkdir -p "$HOME/.elan/toolchains/leanprover--lean4---${VERSION}"
              curl -L "https://github.com/leanprover/lean4/releases/download/${VERSION}/lean-${VERSION_NUM}-linux.tar.zst" \
                  | tar --use-compress-program=zstd -x --strip-components=1 \
                  -C "$HOME/.elan/toolchains/leanprover--lean4---${VERSION}"
              elan default "$TOOLCHAIN"
          fi
          echo "::endgroup::"

          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Add elan to PATH for cached toolchain
        if: steps.cache-lean.outputs.cache-hit == 'true'
        run: echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Print Lean version
        run: lean --version

      - name: Build Lean proofs (lake build)
        working-directory: proofs/lean
        run: lake build

      - name: Axiom audit (no sorry, only foundational stdlib axioms)
        working-directory: proofs/lean
        run: |
          cat > /tmp/Axioms.lean <<'EOF'
          import Turbo3gpp
          #print axioms Turbo3gpp.Encoder.termination_reaches_zero_state
          #print axioms Turbo3gpp.Interleaver.qpp_bijection_for_supported_K
          #print axioms Turbo3gpp.CRC.crc24A_equivalence
          #print axioms Turbo3gpp.CRC.crc24B_equivalence
          #print axioms Turbo3gpp.CRC.crc16_equivalence
          #print axioms Turbo3gpp.CRC.crc8_equivalence
          EOF
          LEAN_PATH=.lake/build/lib lean /tmp/Axioms.lean | tee /tmp/axioms.out
          # Reject sorry / admit / user-declared axioms. Allowed axioms are
          # Lean's foundational stdlib set: propext, Lean.ofReduceBool,
          # Quot.sound, Classical.choice. Anything else fails the gate.
          if grep -qE 'sorry|admit' /tmp/axioms.out ; then
              echo "ERROR: Lean proofs depend on sorry/admit." >&2
              exit 1
          fi
          # Soft-check: enumerate the allowed foundational axiom names.
          if grep -oE 'depends on axioms: \[[^]]*\]' /tmp/axioms.out \
              | grep -oE '[A-Za-z_][A-Za-z0-9_.]*' \
              | sort -u \
              | grep -vxE '(depends|on|axioms|propext|Lean\.ofReduceBool|Quot\.sound|Classical\.choice)' ; then
              echo "ERROR: Lean proofs depend on an unexpected axiom." >&2
              exit 1
          fi
          echo "Axiom audit passed."

  verify-tla:
    name: TLA+ HARQ model (proofs/tla)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned TLA+ version
        id: tla-pin
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source proofs/tla/tla-version
          echo "version=$TLAPLUS_VERSION"   >> "$GITHUB_OUTPUT"
          echo "url=$TLA2TOOLS_URL"         >> "$GITHUB_OUTPUT"
          echo "sha256=$TLA2TOOLS_SHA256"   >> "$GITHUB_OUTPUT"

      - name: Cache tla2tools.jar
        id: cache-tla
        uses: actions/cache@v4
        with:
          path: ~/.tla
          key: tla-${{ steps.tla-pin.outputs.version }}-${{ steps.tla-pin.outputs.sha256 }}

      - name: Download and verify tla2tools.jar
        if: steps.cache-tla.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.tla"
          curl -L "${{ steps.tla-pin.outputs.url }}" -o "$HOME/.tla/tla2tools.jar"
          echo "${{ steps.tla-pin.outputs.sha256 }}  $HOME/.tla/tla2tools.jar" \
              | sha256sum -c -

      - name: TLC model check (safety invariants + EventualTermination)
        working-directory: proofs/tla
        run: |
          set -euo pipefail
          # -workers auto parallelises model checking over the runner's
          # available cores; -XX:+UseParallelGC silences TLC's startup
          # warning about the JVM garbage collector choice.
          java -XX:+UseParallelGC -cp "$HOME/.tla/tla2tools.jar" tlc2.TLC \
              -config harq.cfg \
              -workers auto \
              harq.tla | tee tlc.out
          # Guard against false-positive exits: TLC exits 0 even when it
          # finds a counterexample to a property unless the property is
          # configured as INVARIANT-with-violation. Belt-and-braces grep:
          # any "Error:" line means model checking found a problem.
          if grep -qE '^Error:' tlc.out ; then
              echo "ERROR: TLC reported an error in the harq model." >&2
              exit 1
          fi
          grep -q 'Model checking completed. No error has been found.' tlc.out

  verify-cryptol:
    name: Cryptol/SAW CRC equivalence (proofs/cryptol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang (for LLVM bitcode generation)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang

      - name: Read pinned SAW version
        id: saw-pin
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source proofs/cryptol/version.txt
          echo "version=$SAW_VERSION"      >> "$GITHUB_OUTPUT"
          echo "url=$SAW_TARBALL_URL"      >> "$GITHUB_OUTPUT"
          echo "sha256=$SAW_TARBALL_SHA256" >> "$GITHUB_OUTPUT"

      - name: Cache SAW toolchain
        id: cache-saw
        uses: actions/cache@v4
        with:
          path: ~/.saw
          key: saw-${{ steps.saw-pin.outputs.version }}-${{ steps.saw-pin.outputs.sha256 }}

      - name: Download, verify, and unpack SAW
        if: steps.cache-saw.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.saw"
          curl -L "${{ steps.saw-pin.outputs.url }}" -o /tmp/saw.tar.gz
          echo "${{ steps.saw-pin.outputs.sha256 }}  /tmp/saw.tar.gz" \
              | sha256sum -c -
          tar -xzf /tmp/saw.tar.gz -C "$HOME/.saw" --strip-components=1
          rm /tmp/saw.tar.gz

      - name: Add SAW to PATH
        run: echo "$HOME/.saw/bin" >> "$GITHUB_PATH"

      - name: Print SAW and Cryptol versions
        run: |
          saw --version
          cryptol --version | head -3

      - name: Compile C reference to LLVM bitcode
        working-directory: proofs/cryptol
        run: clang -emit-llvm -c -O0 -g calculate_crc_bits.c -o calculate_crc_bits.bc

      - name: SAW proof (Cryptol spec ≡ C transliteration, A = 16, all four polys)
        working-directory: proofs/cryptol
        run: |
          set -euo pipefail
          saw crc_3gpp.saw | tee saw.out
          # Guard: SAW prints "Proof succeeded! <name>" per discharged goal and
          # "All four CRC equivalence goals discharged." at the very end.
          # Belt-and-braces: bail on any line that says "Proof failed" or
          # "Subgoal failed".
          if grep -qE 'Proof failed|Subgoal failed|^Error:' saw.out ; then
              echo "ERROR: SAW reported a failed proof." >&2
              exit 1
          fi
          grep -q 'All four CRC equivalence goals discharged.' saw.out

  verify-traceability:
    name: Proof traceability matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proof traceability check
        run: python3 scripts/check_proof_traceability.py
