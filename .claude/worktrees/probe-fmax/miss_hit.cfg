project_root

# Octave 8.4 / MATLAB R2020a-style sources. Configure here so the first CI run
# passes against the existing code unchanged.
octave: "latest"
suppress_rule: "line_length"

# We do not exclude node_modules here -- it does not exist in a fresh clone
# (the `tests` CI job does not run `npm ci`) and MISS_HIT's exclude_dir
# requires the named directory to actually be present. MISS_HIT will not
# descend into it on machines where npm ci has been run either, because no
# .m sources live there anyway.
exclude_dir: "results"
exclude_dir: ".github"

# Layered config strategy: the new test files under tests/ ARE intentionally
# linted by this root config (they should pass mh_style --no-style and
# mh_lint, modulo pre-existing `builtin_shadow` checks for the variable name
# `pi`). The vendored submodules tests/MOxUnit and tests/MOcov are excluded
# via the child config at tests/miss_hit.cfg, not here, because MISS_HIT's
# exclude_dir matches a single directory entry; without the child config the
# walker would still try to lint the submodules' own .m files.
